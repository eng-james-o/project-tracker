name: Build and Release Executable

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build Executable
        run: |
          python installer/build.py
          
      - name: Verify the bundled app opens
        shell: pwsh
        run: |
          $app = Start-Process installer/dist/ProjectTracker.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(120000)) {
            taskkill /PID $app.Id /T /F
            throw "Application startup timed out"
          }
          if ($app.ExitCode -ne 0) { throw "Application exited with code $($app.ExitCode)" }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: installer/dist/ProjectTracker.exe
